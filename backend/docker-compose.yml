# PETSTORE_COMPOSE_V1
name: petstore

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    volumes:
      - petstore_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - backend

  backend:
    image: maven:3.9.11-eclipse-temurin-21
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    working_dir: /workspace
    environment:
      SPRING_BOOT_VERSION: ${SPRING_BOOT_VERSION:-3.5.5}
      MAVEN_OPTS: -Dfile.encoding=UTF-8 -Djansi.force=false -Dstyle.color=never -XX:MaxRAMPercentage=75
      APP_PORT: ${APP_PORT:-8080}
      POSTGRES_PORT: ${POSTGRES_PORT:-55432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?JWT_SECRET_BASE64 is required in .env}
      JWT_ISSUER: ${JWT_ISSUER:-petstore}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL is required in .env}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-System Administrator}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PERMANENT_DELETE_ENABLED: ${PERMANENT_DELETE_ENABLED:-false}
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
    volumes:
      - ./pom.xml:/workspace/pom.xml:ro
      - ./src:/workspace/src:ro
      - backend_target:/workspace/target
      - maven_cache:/root/.m2
    command:
      - /bin/bash
      - -euc
      - |
        echo "Pet Store API: http://localhost:$${APP_PORT}/api"
        echo "Swagger:       http://localhost:$${APP_PORT}/swagger-ui.html"
        echo "Health:        http://localhost:$${APP_PORT}/actuator/health"
        exec mvn -f /workspace/pom.xml -B -ntp -DskipTests org.springframework.boot:spring-boot-maven-plugin:$${SPRING_BOOT_VERSION}:run
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 120s
    networks:
      - backend

volumes:
  petstore_postgres:
  backend_target:
  maven_cache:

networks:
  backend:
    driver: bridge
